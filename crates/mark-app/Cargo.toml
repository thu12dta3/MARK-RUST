[package]
name = "mark-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "MARK Desktop em Rust puro: GUI egui/eframe sobre wgpu (Vulkan), 100% nativa"

[[bin]]
name = "mark-app"
path = "src/main.rs"

[dependencies]
mark-core.workspace = true
mark-engine.workspace = true
mark-tools.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
uuid.workspace = true
dirs.workspace = true

egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
